<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" width="880" height="660" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Videotron indoor di lobi kantor modern</title>
  <desc id="heroDesc">Ilustrasi dinding videotron indoor LED berukuran besar yang terpasang di lobi kantor dengan tampilan konten digital biru.</desc>
  <defs>
    <linearGradient id="wallBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f8ff"/>
    </linearGradient>
    <linearGradient id="screenBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1560f0"/>
      <stop offset="0.55" stop-color="#0b45c4"/>
      <stop offset="1" stop-color="#071a52"/>
    </linearGradient>
    <linearGradient id="floorBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f4fc"/>
      <stop offset="1" stop-color="#dfe7f4"/>
    </linearGradient>
    <linearGradient id="barFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#9dc0ff" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fb0ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7fb0ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pixelGrid" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3.5" r="1.6" fill="#ffffff" opacity="0.16"/>
    </pattern>
    <pattern id="wallGrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0v44" fill="none" stroke="#e9eefb" stroke-width="1"/>
    </pattern>
    <filter id="blurBig" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="880" height="660" fill="url(#wallBg)"/>
  <rect width="880" height="470" fill="url(#wallGrid)" opacity="0.85"/>
  <rect y="470" width="880" height="190" fill="url(#floorBg)"/>
  <rect y="469" width="880" height="2" fill="#dfe7f4"/>

  <ellipse cx="440" cy="470" rx="430" ry="60" fill="#ffffff" opacity="0.65"/>

  <!-- glow behind the video wall -->
  <ellipse cx="440" cy="290" rx="420" ry="230" fill="url(#glow)" filter="url(#blurBig)"/>

  <!-- video wall frame -->
  <rect x="98" y="88" width="684" height="364" rx="18" fill="#0a1633" opacity="0.08"/>
  <rect x="104" y="94" width="672" height="352" rx="14" fill="url(#screenBg)"/>
  <rect x="104" y="94" width="672" height="352" rx="14" fill="url(#pixelGrid)"/>

  <!-- content: soft halo + charts -->
  <circle cx="300" cy="200" r="86" fill="#ffffff" opacity="0.1"/>
  <circle cx="300" cy="200" r="52" fill="#ffffff" opacity="0.14"/>
  <circle cx="300" cy="200" r="24" fill="#ffffff" opacity="0.9"/>

  <g opacity="0.95">
    <rect x="420" y="150" width="300" height="14" rx="7" fill="#ffffff" opacity="0.55"/>
    <rect x="420" y="180" width="230" height="14" rx="7" fill="#ffffff" opacity="0.35"/>
    <rect x="420" y="210" width="268" height="14" rx="7" fill="#ffffff" opacity="0.22"/>
  </g>

  <g>
    <rect x="420" y="300" width="34" height="88" rx="8" fill="url(#barFade)"/>
    <rect x="466" y="266" width="34" height="122" rx="8" fill="url(#barFade)"/>
    <rect x="512" y="322" width="34" height="66" rx="8" fill="url(#barFade)"/>
    <rect x="558" y="242" width="34" height="146" rx="8" fill="url(#barFade)"/>
    <rect x="604" y="288" width="34" height="100" rx="8" fill="url(#barFade)"/>
    <rect x="650" y="256" width="34" height="132" rx="8" fill="url(#barFade)"/>
  </g>

  <path d="M132 400 L212 352 L292 372 L372 312 L452 336 L532 286 L612 306 L692 250 L744 266"
        fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- module seams -->
  <g stroke="#0a1633" stroke-opacity="0.14" stroke-width="2">
    <path d="M328 94v352M552 94v352"/>
    <path d="M104 270h672"/>
  </g>

  <!-- slim media bar under the wall -->
  <rect x="330" y="452" width="220" height="14" rx="7" fill="#cfd9ea"/>
  <rect x="330" y="452" width="220" height="6" rx="3" fill="#a9bdd9"/>

  <!-- floor reflection -->
  <g opacity="0.22" filter="url(#blurBig)">
    <rect x="150" y="486" width="580" height="70" rx="16" fill="#1560f0"/>
  </g>

  <!-- console table on the left -->
  <g>
    <rect x="120" y="486" width="180" height="10" rx="5" fill="#c7d4e8"/>
    <rect x="134" y="496" width="8" height="52" rx="4" fill="#d7e0ef"/>
    <rect x="278" y="496" width="8" height="52" rx="4" fill="#d7e0ef"/>
  </g>

  <!-- people silhouettes for scale -->
  <g>
    <circle cx="722" cy="470" r="19" fill="#0a1633" opacity="0.9"/>
    <path d="M696 586c0-30 12-48 26-48s26 18 26 48z" fill="#0a1633" opacity="0.9"/>
    <circle cx="778" cy="486" r="16" fill="#33415c" opacity="0.75"/>
    <path d="M756 586c0-26 10-42 22-42s22 16 22 42z" fill="#33415c" opacity="0.75"/>
  </g>

  <!-- floating specification badge -->
  <g>
    <rect x="596" y="60" width="196" height="58" rx="16" fill="#ffffff" stroke="#e4e9f2"/>
    <circle cx="626" cy="89" r="14" fill="#f2f7ff"/>
    <path d="M620 89l4 4 8-9" fill="none" stroke="#1157ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="650" y="76" width="112" height="10" rx="5" fill="#0a1633" opacity="0.72"/>
    <rect x="650" y="94" width="76" height="8" rx="4" fill="#8b95a9" opacity="0.7"/>
  </g>

  <g>
    <rect x="86" y="150" width="176" height="58" rx="16" fill="#ffffff" stroke="#e4e9f2"/>
    <circle cx="116" cy="179" r="14" fill="#f2f7ff"/>
    <rect x="108" y="171" width="16" height="16" rx="3" fill="#1157ee"/>
    <rect x="140" y="166" width="100" height="10" rx="5" fill="#0a1633" opacity="0.72"/>
    <rect x="140" y="184" width="62" height="8" rx="4" fill="#8b95a9" opacity="0.7"/>
  </g>
</svg>