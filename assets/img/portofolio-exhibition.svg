<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t">
  <title id="t">Proyek videotron indoor di booth pameran dan exhibition hall</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1560f0"/>
      <stop offset="0.6" stop-color="#0b45c4"/>
      <stop offset="1" stop-color="#071a52"/>
    </linearGradient>
    <linearGradient id="flr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f6fd"/>
      <stop offset="1" stop-color="#d8e2f3"/>
    </linearGradient>
    <pattern id="px" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.25" fill="#ffffff" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect y="430" width="800" height="170" fill="url(#flr)"/>

  <!-- hanging LED ring -->
  <g>
    <path d="M300 0v56M500 0v56" stroke="#dbe4f2" stroke-width="3"/>
    <rect x="236" y="56" width="328" height="112" rx="14" fill="url(#scr)"/>
    <rect x="236" y="56" width="328" height="112" rx="14" fill="url(#px)"/>
    <g opacity="0.9">
      <rect x="272" y="88" width="180" height="14" rx="7" fill="#ffffff" opacity="0.75"/>
      <rect x="272" y="116" width="120" height="12" rx="6" fill="#ffffff" opacity="0.42"/>
      <rect x="464" y="88" width="66" height="42" rx="10" fill="#ffffff" opacity="0.85"/>
    </g>
  </g>

  <!-- backdrop wall behind booth -->
  <rect x="88" y="204" width="624" height="180" rx="14" fill="#0a1633" opacity="0.1"/>
  <rect x="92" y="208" width="616" height="172" rx="12" fill="url(#scr)"/>
  <rect x="92" y="208" width="616" height="172" rx="12" fill="url(#px)"/>
  <g opacity="0.9">
    <rect x="140" y="250" width="252" height="16" rx="8" fill="#ffffff" opacity="0.72"/>
    <rect x="140" y="282" width="168" height="14" rx="7" fill="#ffffff" opacity="0.42"/>
    <rect x="140" y="318" width="116" height="28" rx="14" fill="#ffffff" opacity="0.88"/>
  </g>
  <g>
