    <rect x="488" y="228" width="30" height="80" rx="7" fill="#ffffff" opacity="0.4"/>
    <rect x="530" y="258" width="30" height="50" rx="7" fill="#ffffff" opacity="0.7"/>
    <rect x="572" y="240" width="30" height="68" rx="7" fill="#ffffff" opacity="0.5"/>
    <rect x="614" y="264" width="30" height="44" rx="7" fill="#ffffff" opacity="0.34"/>
  </g>

  <!-- counter -->
  <g>
    <rect x="120" y="392" width="240" height="86" rx="12" fill="#ffffff" stroke="#e2e9f5"/>
    <rect x="120" y="392" width="240" height="14" rx="7" fill="#e7eefa"/>
    <rect x="152" y="422" width="14" height="14" rx="3" fill="#1157ee" opacity="0.85"/>
    <rect x="176" y="424" width="94" height="9" rx="4" fill="#cdd8e9"/>
    <rect x="152" y="446" width="130" height="7" rx="3" fill="#e0e7f3"/>
  </g>
  <g>
    <rect x="470" y="392" width="212" height="86" rx="12" fill="#ffffff" stroke="#e2e9f5"/>
    <rect x="470" y="392" width="212" height="14" rx="7" fill="#e7eefa"/>
    <rect x="500" y="424" width="112" height="9" rx="4" fill="#cdd8e9"/>
    <rect x="500" y="446" width="86" height="7" rx="3" fill="#e0e7f3"/>
  </g>

  <!-- visitors -->
  <g fill="#0a1633" opacity="0.88">
