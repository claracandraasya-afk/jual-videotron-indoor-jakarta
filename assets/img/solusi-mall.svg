<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550" role="img" aria-labelledby="t">
  <title id="t">Videotron indoor untuk mall dan showroom</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7cff"/>
      <stop offset="0.55" stop-color="#0b45c4"/>
      <stop offset="1" stop-color="#082a7a"/>
    </linearGradient>
    <linearGradient id="flr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f6fd"/>
      <stop offset="1" stop-color="#dae3f3"/>
    </linearGradient>
    <pattern id="px" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.25" fill="#ffffff" opacity="0.2"/>
    </pattern>
  </defs>

  <rect width="800" height="550" fill="url(#bg)"/>
  <rect y="330" width="800" height="220" fill="url(#flr)"/>

  <!-- upper level railing -->
  <g stroke="#dbe4f2" stroke-width="2">
    <path d="M40 74h720M40 118h720"/>
    <path d="M120 74v44M240 74v44M360 74v44M480 74v44M600 74v44M720 74v44"/>
  </g>

  <!-- big curved LED banner -->
  <rect x="58" y="146" width="684" height="176" rx="16" fill="#0a1633" opacity="0.1"/>
  <rect x="62" y="150" width="676" height="168" rx="14" fill="url(#scr)"/>
  <rect x="62" y="150" width="676" height="168" rx="14" fill="url(#px)"/>

  <circle cx="176" cy="234" r="46" fill="#ffffff" opacity="0.16"/>
  <circle cx="176" cy="234" r="28" fill="#ffffff" opacity="0.9"/>
  <rect x="130" y="196" width="92" height="0" fill="none"/>
  <text x="176" y="243" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="22" font-weight="800" fill="#0b45c4">50%</text>

  <g opacity="0.9">
    <rect x="266" y="196" width="256" height="16" rx="8" fill="#ffffff" opacity="0.72"/>
    <rect x="266" y="228" width="182" height="14" rx="7" fill="#ffffff" opacity="0.42"/>
    <rect x="266" y="258" width="118" height="26" rx="13" fill="#ffffff" opacity="0.88"/>
  </g>
  <g>
    <rect x="580" y="192" width="26" height="60" rx="6" fill="#ffffff" opacity="0.5"/>
    <rect x="616" y="176" width="26" height="76" rx="6" fill="#ffffff" opacity="0.72"/>
    <rect x="652" y="204" width="26" height="48" rx="6" fill="#ffffff" opacity="0.4"/>
    <rect x="688" y="186" width="26" height="66" rx="6" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- storefronts -->
  <g>
    <rect x="40" y="352" width="240" height="150" rx="10" fill="#ffffff" stroke="#e2e9f5"/>
    <rect x="40" y="352" width="240" height="34" rx="10" fill="#e7eefa"/>
    <rect x="72" y="410" width="72" height="52" rx="6" fill="#f2f7ff"/>
    <rect x="164" y="410" width="72" height="52" rx="6" fill="#f2f7ff"/>
  </g>
  <g>
    <rect x="306" y="352" width="240" height="150" rx="10" fill="#ffffff" stroke="#e2e9f5"/>
    <rect x="306" y="352" width="240" height="34" rx="10" fill="#e7eefa"/>
    <rect x="338" y="410" width="72" height="52" rx="6" fill="#f2f7ff"/>
    <rect x="430" y="410" width="72" height="52" rx="6" fill="#f2f7ff"/>
  </g>
  <g>
    <rect x="572" y="352" width="188" height="150" rx="10" fill="#ffffff" stroke="#e2e9f5"/>
    <rect x="572" y="352" width="188" height="34" rx="10" fill="#e7eefa"/>
    <rect x="604" y="410" width="56" height="52" rx="6" fill="#f2f7ff"/>
    <rect x="676" y="410" width="56" height="52" rx="6" fill="#f2f7ff"/>
  </g>

  <!-- escalator -->
  <path d="M704 550 L800 470" stroke="#dbe4f2" stroke-width="10" stroke-linecap="round"/>

  <!-- visitors -->
  <g fill="#0a1633" opacity="0.85">
    <circle cx="180" cy="470" r="12"/>
    <path d="M164 534c0-19 7-30 16-30s16 11 16 30z"/>
  </g>
  <g fill="#33415c" opacity="0.68">
    <circle cx="300" cy="482" r="11"/>
    <path d="M286 534c0-17 6-27 14-27s14 10 14 27z"/>
  </g>
  <g fill="#33415c" opacity="0.55">
    <circle cx="512" cy="478" r="10"/>
    <path d="M499 534c0-16 6-25 13-25s13 9 13 25z"/>
  </g>
</svg>