<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t">
  <title id="t">Videotron indoor Hikvision seri LED indoor</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a67f5"/>
      <stop offset="0.6" stop-color="#0b45c4"/>
      <stop offset="1" stop-color="#071a52"/>
    </linearGradient>
    <pattern id="px" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.7" fill="#ffffff" opacity="0.18"/>
    </pattern>
    <filter id="b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="400" cy="300" rx="330" ry="200" fill="#1157ee" opacity="0.12" filter="url(#b)"/>

  <rect x="86" y="112" width="628" height="330" rx="18" fill="#0a1633" opacity="0.1"/>
  <rect x="92" y="118" width="616" height="318" rx="14" fill="url(#screen)"/>
  <rect x="92" y="118" width="616" height="318" rx="14" fill="url(#px)"/>

  <g stroke="#0a1633" stroke-opacity="0.16" stroke-width="2">
    <path d="M298 118v318M504 118v318"/>
    <path d="M92 277h616"/>
  </g>

  <!-- content -->
  <circle cx="250" cy="205" r="62" fill="#ffffff" opacity="0.12"/>
  <text x="250" y="196" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="30" font-weight="800" fill="#ffffff">HIK</text>
  <text x="250" y="228" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#cfe0ff" letter-spacing="4">VISION</text>

  <g opacity="0.8">
    <rect x="356" y="170" width="300" height="13" rx="6" fill="#ffffff" opacity="0.6"/>
    <rect x="356" y="196" width="212" height="13" rx="6" fill="#ffffff" opacity="0.36"/>
    <rect x="356" y="222" width="256" height="13" rx="6" fill="#ffffff" opacity="0.2"/>
  </g>

  <g>
    <rect x="356" y="320" width="26" height="70" rx="7" fill="#ffffff" opacity="0.7"/>
    <rect x="392" y="292" width="26" height="98" rx="7" fill="#ffffff" opacity="0.55"/>
    <rect x="428" y="342" width="26" height="48" rx="7" fill="#ffffff" opacity="0.4"/>
    <rect x="464" y="266" width="26" height="124" rx="7" fill="#ffffff" opacity="0.8"/>
    <rect x="500" y="310" width="26" height="80" rx="7" fill="#ffffff" opacity="0.45"/>
    <rect x="536" y="284" width="26" height="106" rx="7" fill="#ffffff" opacity="0.6"/>
    <rect x="572" y="326" width="26" height="64" rx="7" fill="#ffffff" opacity="0.38"/>
  </g>

  <path d="M130 400 L206 356 L282 376 L358 330" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="4" stroke-linecap="round"/>

  <!-- floor shadow -->
  <ellipse cx="400" cy="470" rx="270" ry="26" fill="#0a1633" opacity="0.08"/>

  <!-- spec chip -->
  <g>
    <rect x="558" y="60" width="196" height="60" rx="16" fill="#ffffff" stroke="#e4e9f2"/>
    <circle cx="588" cy="90" r="14" fill="#f2f7ff"/>
    <rect x="582" y="84" width="12" height="12" rx="2" fill="#1157ee"/>
    <rect x="612" y="76" width="118" height="10" rx="5" fill="#0a1633" opacity="0.75"/>
    <rect x="612" y="95" width="72" height="8" rx="4" fill="#8b95a9" opacity="0.7"/>
  </g>
  <g>
    <rect x="46" y="180" width="150" height="52" rx="14" fill="#ffffff" stroke="#e4e9f2"/>
    <rect x="66" y="196" width="108" height="9" rx="4" fill="#0a1633" opacity="0.7"/>
    <rect x="66" y="212" width="66" height="8" rx="4" fill="#8b95a9" opacity="0.7"/>
  </g>

  <!-- control box -->
  <g>
    <rect x="330" y="472" width="140" height="66" rx="12" fill="#ffffff" stroke="#e4e9f2"/>
    <rect x="348" y="490" width="58" height="8" rx="4" fill="#1157ee" opacity="0.85"/>
    <rect x="348" y="506" width="104" height="7" rx="4" fill="#c8d4e6"/>
    <rect x="348" y="520" width="86" height="7" rx="4" fill="#dde5f1"/>
    <circle cx="440" cy="494" r="4" fill="#48d18a"/>
