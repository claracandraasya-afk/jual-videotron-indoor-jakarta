<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550" role="img" aria-labelledby="t">
  <title id="t">Videotron indoor untuk hotel dan acara</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7cff"/>
      <stop offset="0.55" stop-color="#0b45c4"/>
      <stop offset="1" stop-color="#071a52"/>
    </linearGradient>
    <linearGradient id="flr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f6fd"/>
      <stop offset="1" stop-color="#d8e2f3"/>
    </linearGradient>
    <pattern id="px" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.25" fill="#ffffff" opacity="0.2"/>
    </pattern>
  </defs>

  <rect width="800" height="550" fill="url(#bg)"/>
  <rect y="336" width="800" height="214" fill="url(#flr)"/>

  <!-- hanging lights -->
  <g stroke="#dbe4f2" stroke-width="2">
    <path d="M200 0v46M340 0v34M460 0v34M600 0v46"/>
  </g>
  <g fill="#cfe0ff">
    <circle cx="200" cy="56" r="12"/>
    <circle cx="340" cy="44" r="10"/>
    <circle cx="460" cy="44" r="10"/>
    <circle cx="600" cy="56" r="12"/>
  </g>

  <!-- LED backdrop on stage -->
  <rect x="118" y="86" width="564" height="216" rx="14" fill="#0a1633" opacity="0.1"/>
  <rect x="122" y="90" width="556" height="208" rx="12" fill="url(#scr)"/>
  <rect x="122" y="90" width="556" height="208" rx="12" fill="url(#px)"/>

  <g opacity="0.9">
    <rect x="200" y="140" width="400" height="20" rx="10" fill="#ffffff" opacity="0.78"/>
    <rect x="270" y="176" width="260" height="14" rx="7" fill="#ffffff" opacity="0.44"/>
    <rect x="308" y="212" width="184" height="34" rx="17" fill="#ffffff" opacity="0.88"/>
  </g>
  <circle cx="164" cy="120" r="26" fill="#ffffff" opacity="0.14"/>
  <circle cx="636" cy="120" r="26" fill="#ffffff" opacity="0.14"/>

  <!-- stage platform -->
  <rect x="94" y="312" width="612" height="26" rx="10" fill="#e7eefa"/>
  <rect x="94" y="336" width="612" height="8" fill="#d5dff0"/>

  <!-- spotlights beams -->
  <g opacity="0.35">
    <path d="M180 86 L120 336 L214 336 Z" fill="#9dc0ff"/>
    <path d="M620 86 L586 336 L680 336 Z" fill="#9dc0ff"/>
  </g>

  <!-- round tables -->
  <g>
    <ellipse cx="200" cy="452" rx="96" ry="28" fill="#ffffff" stroke="#e2e9f5"/>
    <rect x="194" y="452" width="12" height="40" rx="6" fill="#d5dff0"/>
    <ellipse cx="200" cy="498" rx="46" ry="12" fill="#e7eefa"/>
  </g>
  <g>
    <ellipse cx="440" cy="472" rx="106" ry="30" fill="#ffffff" stroke="#e2e9f5"/>
    <rect x="434" y="472" width="12" height="42" rx="6" fill="#d5dff0"/>
    <ellipse cx="440" cy="520" rx="50" ry="12" fill="#e7eefa"/>
  </g>
  <g>
    <ellipse cx="660" cy="446" rx="88" ry="26" fill="#ffffff" stroke="#e2e9f5"/>
    <rect x="654" y="446" width="12" height="38" rx="6" fill="#d5dff0"/>
    <ellipse cx="660" cy="490" rx="42" ry="11" fill="#e7eefa"/>
  </g>

  <!-- guests -->
  <g fill="#0a1633" opacity="0.85">
    <circle cx="382" cy="386" r="14"/>
    <path d="M362 450c0-22 9-34 20-34s20 12 20 34z"/>
  </g>
  <g fill="#33415c" opacity="0.65">
    <circle cx="500" cy="392" r="12"/>
    <path d="M484 450c0-19 7-29 16-29s16 10 16 29z"/>
  </g>
</svg>