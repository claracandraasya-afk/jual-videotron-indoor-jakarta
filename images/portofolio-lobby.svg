<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t">
  <title id="t">Proyek videotron indoor di lobi gedung perkantoran Jakarta</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7cff"/>
      <stop offset="0.55" stop-color="#0b45c4"/>
      <stop offset="1" stop-color="#071a52"/>
    </linearGradient>
    <linearGradient id="flr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f6fd"/>
      <stop offset="1" stop-color="#dae3f3"/>
    </linearGradient>
    <pattern id="px" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.25" fill="#ffffff" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect y="420" width="800" height="180" fill="url(#flr)"/>

  <!-- double height wall -->
  <rect x="150" y="64" width="330" height="356" rx="16" fill="#0a1633" opacity="0.1"/>
  <rect x="154" y="68" width="322" height="348" rx="14" fill="url(#scr)"/>
  <rect x="154" y="68" width="322" height="348" rx="14" fill="url(#px)"/>

  <circle cx="256" cy="170" r="52" fill="#ffffff" opacity="0.14"/>
  <circle cx="256" cy="170" r="30" fill="#ffffff" opacity="0.9"/>
  <g opacity="0.9">
    <rect x="182" y="258" width="238" height="16" rx="8" fill="#ffffff" opacity="0.72"/>
    <rect x="182" y="292" width="164" height="14" rx="7" fill="#ffffff" opacity="0.4"/>
    <rect x="182" y="330" width="196" height="14" rx="7" fill="#ffffff" opacity="0.26"/>
  </g>
  <rect x="182" y="364" width="96" height="30" rx="15" fill="#ffffff" opacity="0.85"/>

  <!-- reception column -->
  <g>
    <rect x="536" y="120" width="216" height="300" rx="14" fill="#ffffff" stroke="#e2e9f5"/>
    <rect x="560" y="150" width="168" height="12" rx="6" fill="#0a1633" opacity="0.7"/>
    <rect x="560" y="176" width="112" height="10" rx="5" fill="#8b95a9" opacity="0.6"/>
    <rect x="560" y="212" width="168" height="86" rx="10" fill="#eaf1fd"/>
    <rect x="560" y="320" width="168" height="10" rx="5" fill="#cfdaea"/>
    <rect x="560" y="342" width="126" height="10" rx="5" fill="#dde5f1"/>
    <rect x="560" y="364" width="146" height="10" rx="5" fill="#e6ecf6"/>
  </g>

  <!-- plant -->
  <g>
    <rect x="72" y="404" width="54" height="52" rx="10" fill="#e7eefa"/>
    <circle cx="99" cy="372" r="26" fill="#9dc0ff" opacity="0.85"/>
    <circle cx="74" cy="392" r="17" fill="#c8dcff"/>
    <circle cx="124" cy="392" r="17" fill="#c8dcff"/>
  </g>

  <!-- people -->
  <g fill="#0a1633" opacity="0.9">
    <circle cx="404" cy="452" r="18"/>
    <path d="M378 560c0-28 12-46 26-46s26 18 26 46z"/>
  </g>
  <g fill="#33415c" opacity="0.7">
    <circle cx="474" cy="466" r="15"/>
    <path d="M452 560c0-24 10-38 22-38s22 14 22 38z"/>
  </g>
</svg>