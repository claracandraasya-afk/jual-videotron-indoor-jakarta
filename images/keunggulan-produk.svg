<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 700" width="720" height="700" role="img" aria-labelledby="t">
  <title id="t">Pilihan modul videotron indoor Hikvision, Samsung, dan LG dengan pixel pitch berbeda</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1560f0"/>
      <stop offset="0.6" stop-color="#0b45c4"/>
      <stop offset="1" stop-color="#071a52"/>
    </linearGradient>
    <linearGradient id="flr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f6fd"/>
      <stop offset="1" stop-color="#dde6f4"/>
    </linearGradient>
    <pattern id="px" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.25" fill="#ffffff" opacity="0.2"/>
    </pattern>
    <pattern id="px1" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.35" fill="#1157ee" opacity="0.5"/>
    </pattern>
    <pattern id="px2" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="4.5" cy="4.5" r="1.45" fill="#1157ee" opacity="0.5"/>
    </pattern>
    <pattern id="px3" width="13" height="13" patternUnits="userSpaceOnUse">
      <circle cx="6.5" cy="6.5" r="1.55" fill="#1157ee" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="720" height="700" fill="url(#bg)"/>
  <rect y="500" width="720" height="200" fill="url(#flr)"/>
  <rect y="499" width="720" height="2" fill="#dde6f4"/>

  <!-- layar tinggi, modul lebih rapat -->
  <rect x="52" y="136" width="208" height="258" rx="12" fill="#0a1633" opacity="0.1"/>
  <rect x="56" y="140" width="200" height="250" rx="10" fill="url(#scr)"/>
  <rect x="56" y="140" width="200" height="250" rx="10" fill="url(#px)"/>
  <rect x="80" y="168" width="132" height="12" rx="6" fill="#ffffff" opacity="0.7"/>
  <rect x="80" y="190" width="88" height="10" rx="5" fill="#ffffff" opacity="0.4"/>
  <circle cx="190" cy="242" r="34" fill="#ffffff" opacity="0.16"/>
  <circle cx="190" cy="242" r="18" fill="#ffffff" opacity="0.85"/>
  <rect x="80" y="330" width="42" height="34" rx="6" fill="#ffffff" opacity="0.6"/>
  <rect x="132" y="316" width="42" height="48" rx="6" fill="#ffffff" opacity="0.42"/>
  <rect x="184" y="340" width="42" height="24" rx="6" fill="#ffffff" opacity="0.28"/>

  <!-- layar lebar, modul sedang -->
  <rect x="268" y="92" width="240" height="204" rx="12" fill="#0a1633" opacity="0.1"/>
  <rect x="272" y="96" width="232" height="196" rx="10" fill="url(#scr)"/>
  <rect x="272" y="96" width="232" height="196" rx="10" fill="url(#px)"/>
  <circle cx="316" cy="150" r="28" fill="#ffffff" opacity="0.16"/>
  <circle cx="316" cy="150" r="15" fill="#ffffff" opacity="0.85"/>
  <rect x="364" y="126" width="116" height="12" rx="6" fill="#ffffff" opacity="0.7"/>
  <rect x="364" y="150" width="80" height="10" rx="5" fill="#ffffff" opacity="0.42"/>
  <rect x="364" y="174" width="98" height="8" rx="4" fill="#ffffff" opacity="0.26"/>
  <rect x="296" y="212" width="184" height="42" rx="10" fill="#ffffff" opacity="0.16"/>
  <rect x="312" y="228" width="72" height="11" rx="5" fill="#ffffff" opacity="0.7"/>

  <!-- layar ramping, modul lebih longgar -->
  <rect x="516" y="166" width="152" height="228" rx="12" fill="#0a1633" opacity="0.1"/>
  <rect x="520" y="170" width="144" height="220" rx="10" fill="url(#scr)"/>
  <rect x="520" y="170" width="144" height="220" rx="10" fill="url(#px)"/>
  <rect x="540" y="196" width="104" height="11" rx="5" fill="#ffffff" opacity="0.7"/>
  <rect x="540" y="215" width="68" height="9" rx="4" fill="#ffffff" opacity="0.4"/>
  <circle cx="592" cy="290" r="32" fill="#ffffff" opacity="0.16"/>
  <circle cx="592" cy="290" r="17" fill="#ffffff" opacity="0.85"/>
  <rect x="540" y="348" width="86" height="8" rx="4" fill="#ffffff" opacity="0.3"/>

  <!-- garis dasar ketinggian modul -->
  <g stroke="#1157ee" stroke-width="2" stroke-dasharray="6 6">
    <path d="M56 424h608"/>
    <path d="M56 414v20M664 414v20"/>
  </g>

  <!-- pilihan pixel pitch -->
  <rect x="88" y="548" width="168" height="96" rx="14" fill="#ffffff" stroke="#e4e9f2"/>
  <rect x="104" y="564" width="136" height="46" rx="8" fill="#f2f7ff"/>
  <rect x="104" y="564" width="136" height="46" rx="8" fill="url(#px1)"/>
  <rect x="104" y="622" width="72" height="9" rx="4" fill="#0a1633" opacity="0.55"/>

  <rect x="276" y="548" width="168" height="96" rx="14" fill="#ffffff" stroke="#e4e9f2"/>
  <rect x="292" y="564" width="136" height="46" rx="8" fill="#f2f7ff"/>
  <rect x="292" y="564" width="136" height="46" rx="8" fill="url(#px2)"/>
  <rect x="292" y="622" width="72" height="9" rx="4" fill="#0a1633" opacity="0.55"/>

  <rect x="464" y="548" width="168" height="96" rx="14" fill="#ffffff" stroke="#e4e9f2"/>
  <rect x="480" y="564" width="136" height="46" rx="8" fill="#f2f7ff"/>
  <rect x="480" y="564" width="136" height="46" rx="8" fill="url(#px3)"/>
  <rect x="480" y="622" width="72" height="9" rx="4" fill="#0a1633" opacity="0.55"/>

  <!-- kartu keterangan -->
  <rect x="496" y="30" width="170" height="46" rx="14" fill="#ffffff" stroke="#e4e9f2"/>
  <circle cx="524" cy="53" r="14" fill="#f2f7ff"/>
  <path d="M518 53h12M524 47v12" stroke="#1157ee" stroke-width="3" stroke-linecap="round"/>
  <rect x="548" y="40" width="106" height="10" rx="5" fill="#0a1633" opacity="0.72"/>
  <rect x="548" y="57" width="70" height="8" rx="4" fill="#8b95a9" opacity="0.7"/>
</svg>
