<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t">
  <title id="t">Videotron indoor LG modul LED indoor</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="modul" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1560f0"/>
      <stop offset="0.55" stop-color="#0b45c4"/>
      <stop offset="1" stop-color="#071a52"/>
    </linearGradient>
    <pattern id="px" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.3" fill="#ffffff" opacity="0.2"/>
    </pattern>
    <filter id="b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="400" cy="300" rx="340" ry="190" fill="#1157ee" opacity="0.12" filter="url(#b)"/>

  <!-- modular tiles with visible seams -->
  <g>
    <rect x="84" y="126" width="306" height="152" rx="8" fill="url(#modul)"/>
    <rect x="402" y="126" width="314" height="152" rx="8" fill="url(#modul)"/>
    <rect x="84" y="290" width="306" height="152" rx="8" fill="url(#modul)"/>
    <rect x="402" y="290" width="314" height="152" rx="8" fill="url(#modul)"/>
  </g>
  <g>
    <rect x="84" y="126" width="306" height="152" rx="8" fill="url(#px)"/>
    <rect x="402" y="126" width="314" height="152" rx="8" fill="url(#px)"/>
    <rect x="84" y="290" width="306" height="152" rx="8" fill="url(#px)"/>
    <rect x="402" y="290" width="314" height="152" rx="8" fill="url(#px)"/>
  </g>

  <!-- content -->
  <circle cx="150" cy="202" r="42" fill="#ffffff" opacity="0.85"/>
  <path d="M132 202h36M150 184v36" stroke="#0b45c4" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <g opacity="0.85">
    <rect x="214" y="182" width="150" height="12" rx="6" fill="#ffffff" opacity="0.6"/>
    <rect x="214" y="206" width="106" height="12" rx="6" fill="#ffffff" opacity="0.34"/>
  </g>

  <g>
    <rect x="446" y="166" width="34" height="74" rx="8" fill="#ffffff" opacity="0.72"/>
    <rect x="490" y="196" width="34" height="44" rx="8" fill="#ffffff" opacity="0.45"/>
    <rect x="534" y="152" width="34" height="88" rx="8" fill="#ffffff" opacity="0.85"/>
    <rect x="578" y="182" width="34" height="58" rx="8" fill="#ffffff" opacity="0.5"/>
    <rect x="622" y="164" width="34" height="76" rx="8" fill="#ffffff" opacity="0.66"/>
  </g>

  <path d="M116 414 L200 372 L284 392 L368 344 L452 366 L536 320 L620 340 L704 296"
        fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- controller / sending card -->
  <g>
    <rect x="330" y="470" width="152" height="66" rx="12" fill="#ffffff" stroke="#e4e9f2"/>
    <rect x="348" y="488" width="52" height="8" rx="4" fill="#1157ee" opacity="0.9"/>
    <rect x="348" y="504" width="116" height="7" rx="4" fill="#c8d4e6"/>
    <rect x="348" y="518" width="92" height="7" rx="4" fill="#dde5f1"/>
    <circle cx="452" cy="492" r="4" fill="#48d18a"/>
  </g>

  <ellipse cx="400" cy="458" rx="268" ry="22" fill="#0a1633" opacity="0.07"/>

  <g>
    <rect x="46" y="176" width="150" height="56" rx="16" fill="#ffffff" stroke="#e4e9f2"/>
    <circle cx="76" cy="204" r="14" fill="#f2f7ff"/>
    <rect x="70" y="198" width="12" height="12" rx="2" fill="#1157ee"/>
    <rect x="102" y="192" width="78" height="9" rx="4" fill="#0a1633" opacity="0.72"/>
    <rect x="102" y="209" width="52" height="8" rx="4" fill="#8b95a9" opacity="0.7"/>
  </g>
</svg>