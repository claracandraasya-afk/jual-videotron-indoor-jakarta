<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 700" width="720" height="700" role="img" aria-labelledby="t">
  <title id="t">Tampilan videotron indoor dengan warna konsisten dan kontras tajam</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1560f0"/>
      <stop offset="0.6" stop-color="#0b45c4"/>
      <stop offset="1" stop-color="#071a52"/>
    </linearGradient>
    <linearGradient id="flr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f6fd"/>
      <stop offset="1" stop-color="#dde6f4"/>
    </linearGradient>
    <pattern id="px" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.25" fill="#ffffff" opacity="0.2"/>
    </pattern>
    <clipPath id="lens">
      <circle cx="170" cy="412" r="64"/>
    </clipPath>
  </defs>

  <rect width="720" height="700" fill="url(#bg)"/>
  <rect y="500" width="720" height="200" fill="url(#flr)"/>
  <rect y="499" width="720" height="2" fill="#dde6f4"/>

  <!-- panel layar utama -->
  <rect x="52" y="92" width="612" height="308" rx="12" fill="#0a1633" opacity="0.1"/>
  <rect x="56" y="96" width="604" height="300" rx="10" fill="url(#scr)"/>
  <rect x="56" y="96" width="604" height="300" rx="10" fill="url(#px)"/>

  <!-- konten: tipografi & sorotan -->
  <rect x="96" y="136" width="228" height="14" rx="7" fill="#ffffff" opacity="0.7"/>
  <rect x="96" y="162" width="150" height="12" rx="6" fill="#ffffff" opacity="0.4"/>
  <circle cx="580" cy="196" r="42" fill="#ffffff" opacity="0.16"/>
  <circle cx="580" cy="196" r="24" fill="#ffffff" opacity="0.85"/>

  <!-- bar kontras warna -->
  <g fill="#ffffff">
    <rect x="96" y="222" width="40" height="118" rx="6" opacity="0.85"/>
    <rect x="152" y="222" width="40" height="118" rx="6" opacity="0.68"/>
    <rect x="208" y="222" width="40" height="118" rx="6" opacity="0.52"/>
    <rect x="264" y="222" width="40" height="118" rx="6" opacity="0.4"/>
    <rect x="320" y="222" width="40" height="118" rx="6" opacity="0.3"/>
    <rect x="376" y="222" width="40" height="118" rx="6" opacity="0.22"/>
    <rect x="432" y="222" width="40" height="118" rx="6" opacity="0.15"/>
  </g>
  <rect x="96" y="364" width="376" height="8" rx="4" fill="#ffffff" opacity="0.35"/>

  <!-- lensa: ketajaman piksel -->
  <path d="M222 464l48 48" stroke="#0a1633" stroke-opacity="0.9" stroke-width="13" stroke-linecap="round"/>
  <circle cx="170" cy="412" r="74" fill="#ffffff" opacity="0.97" stroke="#e4e9f2" stroke-width="2"/>
  <g clip-path="url(#lens)" fill="#0b45c4">
    <g opacity="0.9">
      <circle cx="130" cy="366" r="5"/><circle cx="174" cy="366" r="5"/>
      <circle cx="152" cy="388" r="5"/><circle cx="196" cy="388" r="5"/>
      <circle cx="130" cy="410" r="5"/><circle cx="174" cy="410" r="5"/>
      <circle cx="152" cy="432" r="5"/><circle cx="196" cy="432" r="5"/>
      <circle cx="130" cy="454" r="5"/><circle cx="174" cy="454" r="5"/>
    </g>
    <g opacity="0.32">
      <circle cx="152" cy="366" r="5"/><circle cx="196" cy="366" r="5"/>
      <circle cx="130" cy="388" r="5"/><circle cx="174" cy="388" r="5"/>
      <circle cx="152" cy="410" r="5"/><circle cx="196" cy="410" r="5"/>
      <circle cx="130" cy="432" r="5"/><circle cx="174" cy="432" r="5"/>
      <circle cx="152" cy="454" r="5"/><circle cx="196" cy="454" r="5"/>
    </g>
  </g>
  <path d="M124.7 366.7a64 64 0 0 1 28.7-16.5" fill="none" stroke="#9dc0ff" stroke-width="5" stroke-linecap="round" opacity="0.9"/>

  <!-- kartu keterangan -->
  <rect x="300" y="444" width="176" height="46" rx="12" fill="#ffffff" stroke="#e4e9f2"/>
  <rect x="322" y="461" width="92" height="12" rx="6" fill="#1157ee" opacity="0.85"/>
  <rect x="424" y="463" width="32" height="8" rx="4" fill="#cfdaea"/>

  <rect x="490" y="30" width="176" height="46" rx="14" fill="#ffffff" stroke="#e4e9f2"/>
  <circle cx="518" cy="53" r="14" fill="#f2f7ff"/>
  <path d="M512 53h12M518 47v12" stroke="#1157ee" stroke-width="3" stroke-linecap="round"/>
  <rect x="542" y="40" width="112" height="10" rx="5" fill="#0a1633" opacity="0.72"/>
  <rect x="542" y="57" width="74" height="8" rx="4" fill="#8b95a9" opacity="0.7"/>

  <!-- pengamat -->
  <g fill="#0a1633" opacity="0.9">
    <circle cx="600" cy="452" r="18"/>
    <path d="M574 560c0-28 12-46 26-46s26 18 26 46z"/>
  </g>
</svg>
